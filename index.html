<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thời Khóa Biểu Khoa Học</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center py-10 px-4">

    <div class="w-full max-w-3xl">
        <!-- Header -->
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold tracking-tight text-emerald-400 mb-2">🚀 Thời Khóa Biểu Cá Nhân</h1>
            <p class="text-slate-400 text-sm">Học tập kỷ luật, tối ưu hóa hiệu suất mỗi ngày.</p>
        </header>

        <!-- Tab chọn ngày trong tuần -->
        <div id="days-tabs" class="flex flex-wrap justify-center gap-2 mb-8">
            <!-- JavaScript sẽ render các nút ở đây -->
        </div>

        <!-- Khung hiển thị lịch trình -->
        <main id="schedule-container" class="bg-slate-800/60 backdrop-blur border border-slate-700/50 rounded-2xl p-6 shadow-xl">
            <!-- Nội dung chi tiết từng ngày sẽ được render tự động -->
        </main>
    </div>

    <script>
        const scheduleData = {
          "Thứ 2": [
            {time: "07:30 – 09:30", title: "Trí tuệ nhân tạo", desc: "Đọc trước giáo trình, ôn lý thuyết toán/mô hình.", type: "study"},
            {time: "09:45 – 11:30", title: "IELTS Reading", desc: "Giải 1 passage/test + ghi chú từ vựng/paraphrase.", type: "ielts"},
            {time: "13:30 – 15:45", title: "Phân tích & Thiết kế giải thuật", desc: "Luyện bài tập thuật toán, phân tích độ phức tạp.", type: "study"},
            {time: "16:00 – 17:30", title: "Thể dục / Thể thao", desc: "Vận động, rèn luyện thể lực.", type: "sport"},
            {time: "19:00 – 20:45", title: "Mạng máy tính", desc: "Học lý thuyết các tầng giao thức, bài tập chia IP/subnet.", type: "study"},
            {time: "20:45 – 22:30", title: "IELTS Writing", desc: "Task 1 hoặc Task 2, phân tích cấu trúc bài mẫu.", type: "ielts"}
          ],
          "Thứ 3": [
            {time: "07:30 – 09:30", title: "Kinh tế chính trị Mác - Lênin", desc: "Tóm tắt sơ đồ tư duy từng chương, giải đề trắc nghiệm/tự luận.", type: "study"},
            {time: "09:45 – 11:30", title: "IELTS Listening", desc: "Luyện 1 Full Test, nghe chép chính tả các đoạn miss.", type: "ielts"},
            {time: "13:30 – 15:45", title: "PP NCKH trong KHTN", desc: "Đọc tài liệu tham khảo, thực hành viết đề cương/tổng quan.", type: "study"},
            {time: "16:00 – 17:30", title: "Thể dục / Thể thao", desc: "Vận động, rèn luyện thể lực.", type: "sport"},
            {time: "19:00 – 20:45", title: "Trí tuệ nhân tạo", desc: "Làm bài tập thực hành/code thuật toán.", type: "study"},
            {time: "20:45 – 22:30", title: "IELTS Speaking & Vocab", desc: "Luyện phản xạ Part 1-2 theo chủ đề, học từ vựng C1.", type: "ielts"}
          ],
          "Thứ 4": [
            {time: "07:00 – 09:35", title: "🏫 LÊN LỚP: Trí tuệ nhân tạo", desc: "Phòng: A5-404B", type: "school"},
            {time: "09:45 – 11:15", title: "Thư viện trường", desc: "Ôn lại ngay nội dung vừa học môn AI / Làm bài tập nhỏ.", type: "study"},
            {time: "13:00 – 15:35", title: "🏫 LÊN LỚP: PP NCKH trong KHTN", desc: "Phòng: A5-404B", type: "school"},
            {time: "16:00 – 17:30", title: "Thể dục / Thể thao", desc: "Vận động, rèn luyện thể lực.", type: "sport"},
            {time: "19:00 – 20:30", title: "Phân tích & Thiết kế giải thuật", desc: "Chuẩn bị bài cho sáng Thứ 5.", type: "study"},
            {time: "20:45 – 22:30", title: "IELTS Practice", desc: "Nghe Podcast tiếng Anh / Luyện đề tổng hợp.", type: "ielts"}
          ],
          "Thứ 5": [
            {time: "07:00 – 10:30", title: "🏫 LÊN LỚP: Phân tích và thiết kế giải thuật", desc: "Phòng: B3-403", type: "school"},
            {time: "10:45 – 11:30", title: "Ghi chú nhanh", desc: "Các điểm thầy/cô lưu ý, bài tập lớn cần làm.", type: "study"},
            {time: "13:00 – 14:30", title: "Tự học tại phòng/thư viện", desc: "Đọc slide trước giờ học AI ca chiều.", type: "study"},
            {time: "14:45 – 16:30", title: "🏫 LÊN LỚP: Trí tuệ nhân tạo", desc: "Phòng: A5-210", type: "school"},
            {time: "16:45 – 17:30", title: "Vận động nhẹ", desc: "Đi bộ giãn cơ.", type: "sport"},
            {time: "19:00 – 20:45", title: "Mạng máy tính", desc: "Chuẩn bị kiến thức/bài tập cho ca học Thứ 7.", type: "study"},
            {time: "20:45 – 22:30", title: "IELTS Reading & Vocab", desc: "Đọc bài báo học thuật / New Scientist / BBC.", type: "ielts"}
          ],
          "Thứ 6": [
            {time: "07:00 – 08:40", title: "🏫 LÊN LỚP: Kinh tế chính trị Mác - Lênin", desc: "Phòng: B3-102", type: "school"},
            {time: "09:00 – 11:30", title: "IELTS Writing", desc: "Viết bài hoàn chỉnh và tự sửa lỗi ngữ pháp, từ vựng.", type: "ielts"},
            {time: "13:30 – 15:45", title: "Trí tuệ nhân tạo + Thuật toán", desc: "Giải các bài tập lập trình/đồ án.", type: "study"},
            {time: "16:00 – 17:30", title: "Thể dục / Thể thao", desc: "Vận động, rèn luyện thể lực.", type: "sport"},
            {time: "19:00 – 20:45", title: "Kinh tế chính trị Mác - Lênin", desc: "Review lại bài vừa học buổi sáng, chốt kiến thức tuần.", "type": "study"},
            {time: "20:45 – 22:30", title: "IELTS Speaking", desc: "Ghi âm tự nghe lại phát âm, ngữ điệu.", type: "ielts"}
          ],
          "Thứ 7": [
            {time: "07:30 – 09:30", title: "IELTS Full Mock Test", desc: "Listening + Reading.", type: "ielts"},
            {time: "09:45 – 11:30", title: "PP NCKH trong KHTN", desc: "Hoàn thiện bài tập/báo cáo tuần.", "type": "study"},
            {time: "13:00 – 16:30", title: "🏫 LÊN LỚP: Mạng máy tính", desc: "Phòng: A5-404C", type: "school"},
            {time: "17:00 – 18:30", title: "Vận động tự do", desc: "Thư giãn cuối tuần.", type: "sport"},
            {time: "19:30 – 21:30", title: "Làm bài tập lớn/Project nhóm", desc: "AI hoặc Mạng máy tính.", "type": "study"},
            {time: "21:30 – 22:30", title: "Giải trí", desc: "Xem video/phim tiếng Anh giải trí.", "type": "relax"}
          ],
          "Chủ Nhật": [
            {time: "08:00 – 10:00", title: "Review tuần", desc: "Kiểm tra toàn bộ bài tập của 5 môn xem đã hoàn thành 100% chưa.", "type": "review"},
            {time: "10:15 – 11:30", title: "IELTS Writing Review", desc: "Sửa các lỗi sai trong tuần, học list từ vựng mới.", "type": "ielts"},
            {time: "14:00 – 16:30", title: "Xử lý bài tập tồn đọng", desc: "Đọc trước slide tuần tới.", "type": "study"},
            {time: "16:30 – 18:00", title: "Vệ sinh & Chuẩn bị", desc: "Vận động, dọn dẹp phòng, chuẩn bị tài liệu tuần mới.", "type": "relax"},
            {time: "19:30 – 21:30", title: "Học nhẹ nhàng", desc: "Đọc sách chuyên ngành hoặc sách ngoại ngữ.", "type": "study"},
            {time: "21:30 – 23:00", title: "Nghỉ ngơi sớm", desc: "Chuẩn bị tinh thần cho tuần mới.", "type": "relax"}
          ]
        };

        const days = Object.keys(scheduleData);

        // Tự động chọn ngày theo ngày hiện tại của hệ thống (Chủ Nhật = 0, Thứ 2 = 1,...)
        const jsDay = new Date().getDay();
        const mappingDay = { 1: "Thứ 2", 2: "Thứ 3", 3: "Thứ 4", 4: "Thứ 5", 5: "Thứ 6", 6: "Thứ 7", 0: "Chủ Nhật" };
        let activeDay = mappingDay[jsDay] || "Thứ 2";

        const badgeColors = {
            study: "bg-blue-500/10 text-blue-400 border-blue-500/30",
            ielts: "bg-purple-500/10 text-purple-400 border-purple-500/30",
            school: "bg-amber-500/10 text-amber-400 border-amber-500/30",
            sport: "bg-emerald-500/10 text-emerald-400 border-emerald-500/30",
            relax: "bg-pink-500/10 text-pink-400 border-pink-500/30",
            review: "bg-cyan-500/10 text-cyan-400 border-cyan-500/30"
        };

        function renderTabs() {
            const tabsContainer = document.getElementById("days-tabs");
            tabsContainer.innerHTML = days.map(day => `
                <button onclick="switchDay('${day}')" 
                    class="px-4 py-2 rounded-xl text-sm font-semibold transition-all duration-200 border ${
                        day === activeDay 
                        ? 'bg-emerald-500 text-slate-950 border-emerald-400 shadow-lg shadow-emerald-500/20' 
                        : 'bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700'
                    }">
                    ${day}
                </button>
            `).join('');
        }

        function renderSchedule() {
            const container = document.getElementById("schedule-container");
            const items = scheduleData[activeDay];

            container.innerHTML = `
                <div class="flex justify-between items-center mb-6 border-b border-slate-700/50 pb-4">
                    <h2 class="text-xl font-bold text-slate-100">${activeDay}</h2>
                    <span class="text-xs text-slate-400 bg-slate-700/50 px-3 py-1 rounded-full">${items.length} mốc thời gian</span>
                </div>
                <div class="space-y-4">
                    ${items.map(item => `
                        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between p-4 rounded-xl bg-slate-900/40 border border-slate-700/30 hover:border-slate-600 transition-all gap-3">
                            <div class="flex items-center gap-3">
                                <div class="px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-xs font-mono text-emerald-400 whitespace-nowrap">
                                    ${item.time}
                                </div>
                                <div>
                                    <h3 class="font-semibold text-slate-200 text-sm sm:text-base">${item.title}</h3>
                                    <p class="text-xs sm:text-sm text-slate-400 mt-0.5">${item.desc}</p>
                                </div>
                            </div>
                            <span class="text-[10px] uppercase font-bold tracking-wider px-2.5 py-1 rounded-md border ${badgeColors[item.type] || 'bg-slate-700 text-slate-300'}">
                                ${item.type}
                            </span>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function switchDay(day) {
            activeDay = day;
            renderTabs();
            renderSchedule();
        }

        // Khởi chạy ban đầu
        renderTabs();
        renderSchedule();
    </script>
</body>
</html>
